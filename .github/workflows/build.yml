name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["*.py", "*.md", "*.csv", ".github/workflows/index.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK firmado
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_B64" || { echo "Falta el secreto SIGNING_KEYSTORE_B64"; exit 1; }
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.p12" gradle assembleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk FFTCG-Valor.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FFTCG-Valor-${{ github.run_number }}
          path: FFTCG-Valor.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" FFTCG-Valor.apk --title "FFTCG Valor 1.0.${{ github.run_number }}" --notes "APK compilado de ${{ github.sha }}" --latest
