name: Build APK

# Tres jobs para que la llave de firma nunca esté donde corre Gradle (código de terceros):
#   build   → compila el APK sin firmar (solo lectura, sin secretos)
#   sign    → firma con apksigner del SDK del runner (environment "release" con los secretos)
#   release → publica el APK firmado + attestation de procedencia (único job con escritura)
on:
  push:
    branches: [main]
    paths-ignore: ["*.py", "*.md", "*.csv", ".github/workflows/index.yml"]
  workflow_dispatch:

permissions: {}

env:
  # SHA-256 del certificado de la llave "fftcg" (CN=FFTCG Valor). Es público; si el APK firmado
  # no trae exactamente este certificado, no se publica.
  CERT_SHA256: 70112f4dcb887f779ebcd103df5c94a244008a1ead23a62e944631d616404d11

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK sin firmar
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-sin-firmar
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk-sin-firmar

      - name: Firmar
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_B64" || { echo "Falta el secreto SIGNING_KEYSTORE_B64 (environment release)"; exit 1; }
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "build-tools: $BT"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          "$BT/zipalign" -p -f 4 app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type pkcs12 --ks-key-alias fftcg \
            --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD \
            --out FFTCG-Valor.apk aligned.apk
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Borrar llave
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Verificar firma y certificado
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs FFTCG-Valor.apk | tee certs.txt
          got=$(grep -i 'certificate SHA-256 digest' certs.txt | awk '{print $NF}' | tr 'A-F' 'a-f' | sort -u)
          if [ "$(echo "$got" | wc -l)" != 1 ] || [ "$got" != "$CERT_SHA256" ]; then
            echo "::error::Certificado inesperado: '$got' (esperado $CERT_SHA256)"; exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FFTCG-Valor-${{ github.run_number }}
          path: FFTCG-Valor.apk
          if-no-files-found: error

  release:
    needs: sign
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FFTCG-Valor-${{ github.run_number }}

      - name: SHA-256
        id: hash
        run: |
          sha256sum FFTCG-Valor.apk
          echo "sha256=$(sha256sum FFTCG-Valor.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Procedencia verificable: gh attestation verify FFTCG-Valor.apk -R Guillecc/fftcg-valorizador
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: FFTCG-Valor.apk

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" FFTCG-Valor.apk -R "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "FFTCG Valor 1.0.${{ github.run_number }}" \
            --notes "$(printf 'APK compilado de %s\n\nSHA-256: %s' "${{ github.sha }}" "$SHA256")" --latest
