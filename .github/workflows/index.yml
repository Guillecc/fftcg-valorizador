name: Índice de precios

# Genera index.json.gz (cartas + precio de mercado TCGplayer vía tcgcsv.com) y lo publica en el
# release fijo "index", que la app descarga al iniciar (si su copia tiene más de 12 h).
on:
  schedule:
    - cron: "30 21 * * *" # diario, después de la actualización de tcgcsv (~20:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # También revisa los códigos contra Materia Hunter y deja auditoria.md. Si esa revisión
      # falla, el índice sale igual, solo con las correcciones manuales.
      - name: Generar índice
        run: python build_index.py index.json.gz && ls -l index.json.gz

      - name: Publicar en el release "index"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view index >/dev/null 2>&1 || gh release create index \
            --title "Índice de precios" --notes "Índice que descarga la app. Se actualiza solo cada día." \
            --prerelease --latest=false
          gh release upload index index.json.gz --clobber
          if [ -f auditoria.md ]; then gh release upload index auditoria.md --clobber || true; fi
